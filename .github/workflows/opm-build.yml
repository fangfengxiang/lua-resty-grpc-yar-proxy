name: OPM Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: opm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test
        with:
          install-test-nginx: 'false'
      - name: OPM build validation
        run: |
          printf 'github_account=fangfengxiang\ndownload_server=https://opm.openresty.org\n' > ~/.opmrc
          opm build
